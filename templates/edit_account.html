{% extends "base.html" %}

{% block title %}アカウント設定 - AI投稿監視掲示板{% endblock %}

{% block header %}
<div class="header-right">
    {{ session["username"] }} さん
    <a href="{{ url_for('logout') }}" id="logout-btn" class="logout-btn">ログアウト</a>
</div>
{% endblock %}

{% block content %}

<div class="form-card account-card">
    <h1>アカウント設定</h1>
    <form action="">
        <div class="account-info">
            <div class="account-row"><span class="account-label">ユーザー名：</span><strong>{{ session["username"] }}</strong></div>
            <label for="password">パスワード</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                required
            >

            <label for="confirm_password">パスワード（確認）</label>
            <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                minlength="8"
                required
            >
        </div>
        <button type="submit">パスワードを更新</button>
    </form>

    <hr>

    <div class="account-danger">
      <h2>アカウントの削除</h2>
      <p>アカウントを削除すると、アカウント情報を利用できなくなります。</p>
      <a href="{{ url_for('delete_account') }}" class="btn danger">アカウントを削除する</a>
    </div>
    <div class="actions"><a href="{{ url_for('posts') }}" class="btn secondary">投稿一覧へ戻る</a></div>
  </div>

{% endblock %}

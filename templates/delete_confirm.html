{% extends "base.html" %}

{% block title %}投稿削除 - AI投稿監視掲示板{% endblock %}

{% block content %}

<div class="confirm-card">
    <div class="warning">!</div>

    <h1>投稿を削除しますか？</h1>
    
    <h4>以下の投稿を削除すると、元に戻すことはできません。</h4>

    <div class="post-preview">
        <p>{{ post["content"] }}</p>
    </div>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('delete_post', post_id=post['id']) }}">

        <div class="actions">
            <a href="{{ url_for('posts') }}" class="btn secondary">
                キャンセル
            </a>

            <button type="submit" class="btn danger">
                削除する
            </button>
        </div>

    </form>
</div>

{% endblock %}
